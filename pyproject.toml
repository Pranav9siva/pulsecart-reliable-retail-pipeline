[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsecart-retail-pipeline"
version = "1.0.0"
description = "A batch and near-real-time retail data pipeline using UCI Online Retail II"
requires-python = ">=3.10,<3.13"
dependencies = [
  "pyspark==3.5.6",
  "pandas==2.2.3",
  "openpyxl==3.1.5",
  "pyarrow==18.1.0",
  "duckdb==1.1.3",
  "kafka-python==2.0.2",
]

[project.scripts]
pulsecart = "pulsecart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]



